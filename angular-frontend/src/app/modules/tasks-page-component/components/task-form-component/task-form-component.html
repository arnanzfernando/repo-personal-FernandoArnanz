<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

  <!-- Título -->
  <div>
    <label class="block text-sm font-medium text-slate-700">Título</label>
    <input
      type="text"
      formControlName="titulo"
      placeholder="Ingrese el título de la tarea"
      class="mt-1 w-full h-10 rounded border px-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
    />
    <div *ngIf="form.get('titulo')?.touched && form.get('titulo')?.invalid" class="mt-1 text-xs text-red-500">
      El título es obligatorio
    </div>
  </div>

  <!-- Descripción -->
  <div>
    <label class="block text-sm font-medium text-slate-700">Descripción</label>
    <textarea
      formControlName="descripcion"
      rows="3"
      placeholder="Describe la tarea"
      class="mt-1 w-full rounded border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
    ></textarea>
    <div *ngIf="form.get('descripcion')?.touched && form.get('descripcion')?.invalid" class="mt-1 text-xs text-red-500">
      La descripción es obligatoria
    </div>
  </div>

  <!-- Estado -->
  <div>
    <label class="block text-sm font-medium text-slate-700">Estado</label>
    <select
      formControlName="estado"
      class="mt-1 w-full h-10 rounded border px-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
    >
      <option value="pendiente">Pendiente</option>
      <option value="en progreso">En progreso</option>
      <option value="completada">Completada</option>
    </select>
  </div>

  <!-- Fecha límite -->
  <div>
    <label class="block text-sm font-medium text-slate-700">Fecha límite</label>
    <input
      type="date"
      formControlName="fechaLimite"
      class="mt-1 w-full h-10 rounded border px-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
    />
  </div>

  <!-- Botón Guardar -->
  <div class="flex justify-end">
    <button
      type="submit"
      [disabled]="form.invalid || isLoading"
      class="inline-flex h-10 items-center rounded-md bg-primary px-5 text-sm font-medium text-white transition hover:bg-primary-700 disabled:cursor-not-allowed disabled:opacity-60 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
    >
      {{ isLoading ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>

</form>
